- title: "When More Isn't Better: Rethinking Scale in Single-Cell Foundation Models"
  date: 2025-11-21
  time: "1:00 – 2:00 PM ET"
  format: Invited talk
  partner: ""
  summary: >-
    How do dataset size and diversity affect single-cell foundation model performance?
    Drawing on an analysis of 400 models trained on 22.2 million cells, this talk covers
    key insights on model generalization challenges and practical strategies for optimizing
    AI in precision medicine.
  people:
    - { name: "Ava Amini, PhD", role: Speaker, position: "Principal Researcher, Microsoft Research" }
  links:
    slides: ""
    recording: ""

- title: "Statistical Strategy and Method in Oncology Precision Medicine Development"
  date: 2025-10-24
  time: "2:00 – 3:00 PM ET"
  format: Inaugural webinar
  partner: ""
  summary: >-
    Statistical methodologies and study design considerations critical to precision
    medicine in oncology, covering both companion diagnostic (CDx) device development and
    therapeutic drug development. Real-world examples illustrate biomarker-driven trial
